<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Withdraw Money</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>
                Withdraw Money
            </h1>

            <p class="subtitle">
                Withdraw money from your bank account
            </p>

            <hr>

            <div
                th:if="${error}"
                style="color: red; margin-bottom: 15px;"
                th:text="${error}"
            >
            </div>

            <form
                action="/withdraw"
                method="post"
            >

                <label for="accountNumber">
                    Account Number
                </label>

                <input
                    type="text"
                    id="accountNumber"
                    name="accountNumber"
                    placeholder="Enter account number"
                    required
                >

                <label for="amount">
                    Withdrawal Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Withdraw Money
                </button>

            </form>

            <br>

            <a href="/dashboard">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
