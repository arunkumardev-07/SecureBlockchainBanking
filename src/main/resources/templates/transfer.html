<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Fund Transfer</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>
                Fund Transfer
            </h1>

            <p class="subtitle">
                Transfer money securely
            </p>

            <hr>

            <div
                th:if="${error}"
                style="color: red; margin-bottom: 15px;"
                th:text="${error}"
            >
            </div>

            <form
                action="/transfer"
                method="post"
            >

                <label for="senderAccount">
                    Sender Account
                </label>

                <input
                    type="text"
                    id="senderAccount"
                    name="senderAccount"
                    placeholder="Enter sender account"
                    required
                >

                <label for="receiverAccount">
                    Receiver Account
                </label>

                <input
                    type="text"
                    id="receiverAccount"
                    name="receiverAccount"
                    placeholder="Enter receiver account"
                    required
                >

                <label for="amount">
                    Transfer Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Transfer Money
                </button>

            </form>

            <br>

            <a href="/dashboard">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
