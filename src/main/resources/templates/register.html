<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account - Secure Banking</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">&#128274;</div>

        <h1>
            Create Account
        </h1>

        <p class="subtitle">
            Register for Secure Blockchain Banking
        </p>

        <div
            th:if="${error}"
            class="error-message"
            th:text="${error}"
            style="
                background:#fdecec;
                color:#b91c1c;
                border:1px solid #fca5a5;
                padding:12px;
                border-radius:8px;
                margin-bottom:20px;
            "
        ></div>

        <form
            action="/register"
            method="post"
        >

            <label for="fullName">
                Full Name
            </label>

            <input
                type="text"
                id="fullName"
                name="fullName"
                placeholder="Enter your full name"
                required
            >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="phone">
                Phone Number
            </label>

            <input
                type="tel"
                id="phone"
                name="phone"
                placeholder="Enter your phone number"
                pattern="[0-9]{10,15}"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Minimum 8 characters"
                minlength="8"
                required
            >

            <label for="confirmPassword">
                Confirm Password
            </label>

            <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter your password"
                minlength="8"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

        <p class="register-text">

            Already have an account?

            <a href="/">
                Login
            </a>

        </p>

    </div>

</div>

</body>

</html>
