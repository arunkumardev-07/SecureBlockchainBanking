<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Secure Blockchain Banking</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

<div class="login-container">

    <div class="login-card">

        <div class="logo">
            &#128274;
        </div>

        <h1>
            Secure Banking
        </h1>

        <p class="subtitle">
            Blockchain-Based Banking System
        </p>

        <!-- Registration success message -->

        <div
            th:if="${success}"
            style="
                background:#e8f7ed;
                color:#166534;
                border:1px solid #86efac;
                padding:12px;
                border-radius:8px;
                margin-bottom:20px;
                text-align:center;
                font-weight:600;
            "
            th:text="${success}"
        ></div>

        <!-- Login error message -->

        <div
            th:if="${error}"
            style="
                background:#fdecec;
                color:#b91c1c;
                border:1px solid #fca5a5;
                padding:12px;
                border-radius:8px;
                margin-bottom:20px;
                text-align:center;
                font-weight:600;
            "
            th:text="${error}"
        ></div>

        <form
            action="/login"
            method="post"
        >

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                required
            >

            <button type="submit">
                Login
            </button>

        </form>

        <p class="register-text">

            Don't have an account?

            <a href="/register">
                Create Account
            </a>

        </p>

    </div>

</div>

</body>

</html>
