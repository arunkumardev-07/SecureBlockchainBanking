<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Deposit Money</title>

    <link
        rel="stylesheet"
        href="/css/style.css"
    >

</head>

<body>

    <div class="login-container">

        <div class="login-card">

            <h1>
                Deposit Money
            </h1>

            <p class="subtitle">
                Add money to your bank account
            </p>

            <hr>

            <form
                action="/deposit"
                method="post"
            >

                <label for="accountNumber">
                    Account Number
                </label>

                <input
                    type="text"
                    id="accountNumber"
                    name="accountNumber"
                    placeholder="Enter account number"
                    required
                >

                <label for="amount">
                    Deposit Amount
                </label>

                <input
                    type="number"
                    id="amount"
                    name="amount"
                    placeholder="Enter amount"
                    min="1"
                    step="0.01"
                    required
                >

                <button type="submit">
                    Deposit Money
                </button>

            </form>

            <br>

            <a href="/dashboard">
                Back to Dashboard
            </a>

        </div>

    </div>

</body>

</html>
